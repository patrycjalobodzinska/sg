<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SG Papertronics — hero variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   PROTOTYPE SURFACE — not production. Delete with the folder.
   Project tokens, mirrored from app/globals.css + landing-markup.ts
   ============================================================ */
:root{
  --navy:#080C18;
  --blue:#2E6BE6;
  --blue-light:#6AA6FF;
  --muted:#AEB4C4;
  --body:#4A5165;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:#F2F4F7;
  font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--navy);
  -webkit-font-smoothing:antialiased;
}
#stage{min-height:100vh}

/* ---------- shared hero chassis ---------- */
.hero-outer{max-width:1660px;margin:0 auto;padding:clamp(8px,1.4vw,16px) clamp(8px,1.4vw,16px) 0}
.hero-card{
  position:relative;border-radius:30px;overflow:hidden;
  min-height:clamp(560px,calc(100vh - 44px),960px);
  display:flex;flex-direction:column;justify-content:flex-end;
  background:var(--navy);
}
.nav{
  position:absolute;top:0;left:0;right:0;z-index:4;
  display:flex;align-items:center;justify-content:space-between;
  padding:30px clamp(22px,3vw,44px) 20px;color:#fff;
}
.nav-logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px;letter-spacing:-.01em}
.nav-logo img{height:34px;width:auto;filter:brightness(0) invert(1)}
.nav-links{display:flex;align-items:center;gap:clamp(14px,1.9vw,30px);font-size:16px;font-weight:600}
.nav-links a{color:#fff;text-decoration:none;opacity:.92}
.nav-cta{
  background:var(--blue);color:#fff;text-decoration:none;
  padding:11px 20px;border-radius:999px;font-weight:500;font-size:15px;white-space:nowrap;
}
.nav-burger{display:none;flex-direction:column;gap:5px;background:transparent;border:0;padding:8px;cursor:pointer}
.nav-burger span{display:block;width:24px;height:2px;border-radius:2px;background:#fff}
@media (max-width:900px){.nav-links{display:none}.nav-burger{display:flex}}

.hero-copy{position:relative;z-index:3;padding:clamp(28px,5vw,60px);max-width:860px}
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  color:rgba(255,255,255,.92);font-size:14px;letter-spacing:.02em;margin:0 0 18px;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue-light);box-shadow:0 0 0 4px rgba(106,166,255,.25);flex:none}
h1{
  margin:0;color:#fff;font-weight:700;
  font-size:clamp(34px,5.2vw,64px);line-height:1.02;letter-spacing:-.02em;max-width:860px;
}
h1 .accent{color:rgba(255,255,255,.88);font-weight:400;font-size:.72em;letter-spacing:-.01em}
.lead{
  margin:22px 0 0;color:rgba(255,255,255,.82);
  font-size:clamp(17px,1.6vw,20px);line-height:1.55;max-width:560px;font-weight:400;
}
.focus{
  display:inline-flex;align-items:center;gap:9px;margin:20px 0 0;padding:9px 15px;
  border:1px solid rgba(255,255,255,.28);border-radius:999px;background:rgba(8,12,24,.34);
  color:#fff;font-size:14.5px;font-weight:500;line-height:1.35;
}
.ctas{display:flex;flex-wrap:wrap;gap:12px 30px;margin-top:34px}
.ctas a{
  display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;
  font-size:17px;font-weight:500;border-bottom:1px solid rgba(255,255,255,.45);
  padding-bottom:4px;transition:gap 200ms ease-out;
}
.ctas a:hover{gap:13px}
.arrow{flex:none;width:15px;height:15px}

/* ---------- entrance motion (shared) ----------
   Entrances only, ease-out, transform+opacity, staggered ~60ms. */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.r{animation:rise 460ms var(--ease) both}
.r2{animation-delay:60ms}
.r3{animation-delay:120ms}
.r4{animation-delay:180ms}
.r5{animation-delay:240ms}
.r6{animation-delay:300ms}
@media (prefers-reduced-motion:reduce){
  .r,.r2,.r3,.r4,.r5,.r6{animation:fade 1ms linear both}
  .draw{stroke-dashoffset:0 !important;animation:none !important}
  .pop{animation:fade 1ms linear both !important}
}

/* ============================================================
   1 — PHOTOGRAPHIC
   ============================================================ */
.v-photo .bg{position:absolute;inset:-6% 0 0 0;z-index:0;background-size:cover;background-position:center}
.v-photo .scrim-radial{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(130% 120% at 4% 96%,rgba(8,12,24,.96) 0%,rgba(8,12,24,.8) 24%,rgba(8,12,24,.5) 42%,rgba(8,12,24,.2) 58%,transparent 74%);
}
.v-photo .scrim-top{
  position:absolute;top:0;left:0;right:0;height:clamp(100px,13vh,148px);z-index:1;pointer-events:none;
  backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
  background:linear-gradient(180deg,rgba(8,12,24,.62),rgba(8,12,24,.3) 52%,transparent);
  -webkit-mask-image:linear-gradient(180deg,#000 62%,transparent);
  mask-image:linear-gradient(180deg,#000 62%,transparent);
}
@media (max-width:760px){
  .v-photo .scrim-radial{
    background:linear-gradient(0deg,rgba(8,12,24,.9) 0%,rgba(8,12,24,.78) 34%,rgba(8,12,24,.6) 62%,rgba(8,12,24,.34) 100%);
  }
  .v-photo .bg{background-position:78% center}
}

/* ============================================================
   2 — DIAGRAM
   ============================================================ */
.v-diagram .hero-card{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);align-items:center;
  background:
    radial-gradient(110% 120% at 88% 12%,rgba(46,107,230,.28) 0%,transparent 58%),
    radial-gradient(90% 100% at 6% 96%,rgba(106,166,255,.14) 0%,transparent 60%),
    var(--navy);
  padding-top:clamp(96px,12vh,132px);
}
.v-diagram .hero-copy{max-width:none;padding-right:clamp(16px,2vw,28px)}
.v-diagram h1,.v-data h1{font-size:clamp(30px,3.4vw,48px)}
.v-diagram .lead,.v-data .lead{font-size:clamp(16px,1.2vw,17.5px);max-width:520px;margin-top:18px}
.v-diagram .flow{position:relative;z-index:3;padding:clamp(20px,3vw,48px) clamp(28px,4vw,60px) clamp(28px,4vw,56px) 0}
.v-diagram .flow svg{width:100%;height:auto;display:block;overflow:visible}
.v-diagram .draw{
  stroke-dasharray:1000;stroke-dashoffset:1000;
  animation:draw 900ms var(--ease) 200ms forwards;
}
@keyframes draw{to{stroke-dashoffset:0}}
.v-diagram .pop{animation:rise 380ms var(--ease) both}
.v-diagram .nlabel{fill:#fff;font:600 14px Montserrat,sans-serif}
.v-diagram .nsub{fill:rgba(255,255,255,.56);font:500 12px Montserrat,sans-serif}
@media (max-width:1000px){
  .v-diagram .nlabel{font-size:17px}
  .v-diagram .nsub{font-size:14px}
  .v-diagram .hero-card{grid-template-columns:1fr;align-content:end}
  .v-diagram .flow{padding:0 clamp(28px,5vw,60px) clamp(28px,5vw,44px)}
}

/* ============================================================
   3 — DATA
   ============================================================ */
.v-data .hero-card{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.92fr);align-items:center;gap:clamp(12px,2vw,32px);
  background:
    radial-gradient(100% 120% at 92% 6%,rgba(46,107,230,.22) 0%,transparent 60%),
    var(--navy);
  padding-top:clamp(96px,12vh,132px);
}
.v-data .hero-copy{max-width:none}
.v-data .panel{
  position:relative;z-index:3;margin:0 clamp(28px,4vw,60px) clamp(28px,4vw,56px) 0;
  padding:22px 24px 18px;border-radius:20px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(2px);
}
.v-data .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:4px}
.v-data .panel-title{color:#fff;font-size:15.5px;font-weight:600}
.v-data .panel-note{color:rgba(255,255,255,.5);font-size:12px;font-weight:500;letter-spacing:.02em}
.v-data .legend{display:flex;gap:18px;margin:10px 0 14px;font-size:12.5px;color:rgba(255,255,255,.72);font-weight:500}
.v-data .legend i{display:inline-block;width:18px;height:2px;border-radius:2px;margin-right:7px;vertical-align:middle}
.v-data .panel svg{width:100%;height:auto;display:block;overflow:visible}
.v-data .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1000ms var(--ease) 180ms forwards}
/* after the draw finishes, settle the second series into a dashed stroke */
.v-data .dash{animation:draw 1000ms var(--ease) 300ms forwards,dashify 1ms linear 1300ms forwards}
@keyframes dashify{to{stroke-dasharray:7 5}}
.v-data .pop{animation:rise 380ms var(--ease) both}
.v-data .spec{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin-top:16px;
  background:rgba(255,255,255,.12);border-radius:12px;overflow:hidden;
}
.v-data .spec div{background:rgba(8,12,24,.55);padding:11px 13px}
.v-data .spec dt{color:rgba(255,255,255,.52);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:0 0 4px}
.v-data .spec dd{color:#fff;font-size:14px;font-weight:600;margin:0}
.v-data .axis{fill:rgba(255,255,255,.42);font:500 11px Montserrat,sans-serif}
@media (max-width:1000px){
  .v-data .hero-card{grid-template-columns:1fr;align-content:end}
  .v-data .panel{margin:0 clamp(28px,5vw,60px) clamp(28px,5vw,40px)}
}

/* ============================================================
   4 — EDITORIAL
   ============================================================ */
.v-editorial .hero-card{
  justify-content:center;
  background:
    radial-gradient(80% 90% at 100% 0%,rgba(46,107,230,.2) 0%,transparent 62%),
    var(--navy);
}
.v-editorial .hero-copy{max-width:1180px;padding:clamp(92px,11vh,124px) clamp(28px,5vw,72px) clamp(32px,4vw,52px)}
.v-editorial h1{font-size:clamp(38px,5.6vw,74px);line-height:1;max-width:17ch}
.v-editorial h1 .accent{display:block;margin-top:.16em;font-size:.52em;line-height:1.1;max-width:22ch}
.v-editorial .rule{height:1px;background:rgba(255,255,255,.16);margin:clamp(24px,3vw,36px) 0 0}
.v-editorial .facts{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:0;margin-top:0;
}
.v-editorial .facts > div{padding:20px 24px 20px 0;border-right:1px solid rgba(255,255,255,.16)}
.v-editorial .facts > div:last-child{border-right:0}
.v-editorial .facts > div + div{padding-left:26px}
.v-editorial dt{color:var(--blue-light);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.v-editorial dd{color:#fff;font-size:clamp(16px,1.35vw,19px);font-weight:500;line-height:1.4;margin:0}
.v-editorial .lead{max-width:640px;margin-top:clamp(20px,2.4vw,28px);font-size:clamp(16px,1.3vw,18px)}
@media (max-width:760px){
  .v-editorial .facts > div{border-right:0;border-bottom:1px solid rgba(255,255,255,.16);padding:20px 0}
  .v-editorial .facts > div + div{padding-left:0}
  .v-editorial .facts > div:last-child{border-bottom:0}
}

/* ============================================================
   PICKER — harness chrome. Verbatim from the skill spec.
   ============================================================ */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>

<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Photographic</button>
  <button class="proto-picker-item">Diagram</button>
  <button class="proto-picker-item">Data</button>
  <button class="proto-picker-item">Editorial</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
/* ---------- shared pieces (audit copy deck, ch. 2/5/12) ---------- */
const ARROW = '<svg class="arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>';

const COPY = {
  eyebrow: 'At-line analytics for biological processes',
  lead: 'Know what is happening in your process',
  accent: '— while you can still act.',
  body: 'Q‑Tector combines ready-to-use assay pods, a compact reader and guided digital workflows to generate comparable glucose and sucrose results close to the fermenter or bioreactor. Use the data to compare runs, refine feed strategies and carry process knowledge from R&D to production.',
  focus: 'Current analytical focus: glucose and sucrose in culture media',
  cta1: 'See how Q‑Tector works',
  cta2: 'Discuss your process',
};

const nav = () => `
  <header class="nav">
    <span class="nav-logo"><img src="/assets/SGPT_logo.png" alt="SG Papertronics"/></span>
    <span class="nav-links">
      <a href="#">Technology</a><a href="#">Applications</a><a href="#">Investors</a><a href="#">News</a><a href="#">Contact</a>
      <a class="nav-cta" href="#">Talk to us</a>
    </span>
    <button class="nav-burger" aria-label="Menu"><span></span><span></span><span></span></button>
  </header>`;

const ctas = (c1 = 'r r5', c2 = 'r r6') => `
  <div class="ctas">
    <a class="${c1}" href="#">${COPY.cta1} ${ARROW}</a>
    <a class="${c2}" href="#">${COPY.cta2} ${ARROW}</a>
  </div>`;

/* ---------- 1 — PHOTOGRAPHIC : photo-led atmosphere ---------- */
const photographic = () => `
<section class="v-photo hero-outer">
  <div class="hero-card">
    <div class="bg" style="background-image:url('/prototypes/qtector-hero-retouched.jpg')"></div>
    <div class="scrim-radial"></div>
    <div class="scrim-top"></div>
    ${nav()}
    <div class="hero-copy">
      <p class="eyebrow r"><span class="dot"></span>${COPY.eyebrow}</p>
      <h1 class="r r2">${COPY.lead} <span class="accent">${COPY.accent}</span></h1>
      <p class="lead r r3">${COPY.body}</p>
      <p class="focus r r4"><span class="dot"></span>${COPY.focus}</p>
      ${ctas()}
    </div>
  </div>
</section>`;

/* ---------- 2 — DIAGRAM : mechanism-led, no photography ---------- */
const GAP_Y = 82;
const STEPS = [
  ['Sample', '0.5 ml from the run'],
  ['Assay pod', 'ready to use, QR-guided'],
  ['Reader', 'result at the point of work'],
  ['Process history', 'trend, compare, export'],
  ['Decision', 'act while the run is live'],
];
const diagram = () => {
  const N = STEPS.length, gapY = GAP_Y, top = 26;
  const nodes = STEPS.map((s, i) => {
    const y = top + i * gapY, delay = 320 + i * 90;
    return `
      <g class="pop" style="animation-delay:${delay}ms">
        <circle cx="34" cy="${y}" r="13" fill="rgba(46,107,230,.22)" stroke="#6AA6FF" stroke-width="1.6"/>
        <circle cx="34" cy="${y}" r="4" fill="#6AA6FF"/>
        <text class="nlabel" x="66" y="${y - 2}">${s[0]}</text>
        <text class="nsub" x="66" y="${y + 17}">${s[1]}</text>
      </g>`;
  }).join('');
  const h = top + (N - 1) * gapY + 40;
  return `
<section class="v-diagram hero-outer">
  <div class="hero-card">
    ${nav()}
    <div class="hero-copy">
      <p class="eyebrow r"><span class="dot"></span>${COPY.eyebrow}</p>
      <h1 class="r r2">${COPY.lead} <span class="accent">${COPY.accent}</span></h1>
      <p class="lead r r3">${COPY.body}</p>
      <p class="focus r r4"><span class="dot"></span>${COPY.focus}</p>
      ${ctas()}
    </div>
    <div class="flow">
      <svg viewBox="0 0 420 ${h}" role="img" aria-label="Sample, assay pod, reader, process history, decision">
        <path class="draw" d="M34 ${top} V ${top + (N - 1) * gapY}" stroke="rgba(106,166,255,.5)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        ${nodes}
      </svg>
    </div>
  </div>
</section>`;
};

/* ---------- 3 — DATA : evidence-led, shows the output ---------- */
const dataViz = () => {
  // Illustrative fed-batch profile. Labelled as illustrative on the panel:
  // no real run data is being passed off as measured.
  const W = 520, H = 210, PAD = 34;
  const glucose = [92,88,79,64,48,34,23,15,10,7,5,4];
  const sucrose = [70,68,63,55,45,36,28,21,16,12,9,7];
  const x = i => PAD + i * ((W - PAD - 12) / (glucose.length - 1));
  const y = v => H - PAD - (v / 100) * (H - PAD - 14);
  const line = a => a.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const grid = [0, 25, 50, 75, 100].map(v =>
    `<line x1="${PAD}" x2="${W - 12}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.09)" stroke-width="1"/>`).join('');
  const hours = [0, 12, 24, 36, 48].map((t, i) =>
    `<text class="axis" x="${x(i * (glucose.length - 1) / 4)}" y="${H - 12}" text-anchor="middle">${t}h</text>`).join('');
  const last = glucose.length - 1;
  return `
<section class="v-data hero-outer">
  <div class="hero-card">
    ${nav()}
    <div class="hero-copy">
      <p class="eyebrow r"><span class="dot"></span>${COPY.eyebrow}</p>
      <h1 class="r r2">${COPY.lead} <span class="accent">${COPY.accent}</span></h1>
      <p class="lead r r3">${COPY.body}</p>
      ${ctas('r r4', 'r r5')}
    </div>
    <div class="panel r r3">
      <div class="panel-head">
        <span class="panel-title">Substrate depletion across a fed-batch run</span>
        <span class="panel-note">ILLUSTRATIVE</span>
      </div>
      <div class="legend">
        <span><i style="background:#6AA6FF"></i>Glucose</span>
        <span><i style="background:repeating-linear-gradient(90deg,#2E6BE6 0 5px,transparent 5px 8px)"></i>Sucrose</span>
      </div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Illustrative glucose and sucrose depletion curves over a 48-hour fed-batch run">
        ${grid}${hours}
        <path class="draw dash" d="${line(sucrose)}" fill="none" stroke="#2E6BE6" stroke-width="2.4" stroke-linecap="round" style="animation-delay:300ms"/>
        <path class="draw" d="${line(glucose)}" fill="none" stroke="#6AA6FF" stroke-width="2.4" stroke-linecap="round"/>
        <g class="pop" style="animation-delay:1000ms">
          <circle cx="${x(last)}" cy="${y(glucose[last])}" r="9" fill="rgba(106,166,255,.22)"/>
          <circle cx="${x(last)}" cy="${y(glucose[last])}" r="4" fill="#fff"/>
        </g>
      </svg>
      <dl class="spec">
        <div><dt>Analyte</dt><dd>Glucose · Sucrose</dd></div>
        <div><dt>Matrix</dt><dd>Culture media</dd></div>
        <div><dt>Where</dt><dd>At-line</dd></div>
      </dl>
    </div>
  </div>
</section>`;
};

/* ---------- 4 — EDITORIAL : type-led, zero asset dependency ---------- */
const editorial = () => `
<section class="v-editorial hero-outer">

      <p class="eyebrow r"><span class="dot"></span>${COPY.eyebrow}</p>

        <div class="r r5"><dt>In</dt><dd>Culture media</dd></div>

        <div class="r r6"><dt>Supports</dt><dd>Process decisions, not release</dd></div>
      </dl>
      ${ctas('r r6', 'r r6')}

/* ---------- picker wiring (verbatim behaviour contract) ---------- */
const variants = [photographic, diagram, dataViz, editorial];

const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
