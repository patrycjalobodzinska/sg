<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SG Papertronics — hero, round 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   PROTOTYPE SURFACE — round 2. Not production.
   Round 1 failed because all four variants shared the same left
   column. Here each variant changes the whole fold: structure,
   tone and how much copy it carries.
   ============================================================ */
:root{
  --navy:#080C18;
  --blue:#2E6BE6;
  --blue-light:#6AA6FF;
  --ink:#0C1220;
  --paper:#F4F5F7;
  --grey:#5A6274;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;background:var(--paper);
}
img{display:block;max-width:100%}

/* ---------- entrance motion: ease-out, transform+opacity ---------- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes wipe{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes zoom{from{transform:scale(1.06)}to{transform:scale(1)}}
.r{animation:rise 480ms var(--ease) both}
.d1{animation-delay:70ms}.d2{animation-delay:140ms}.d3{animation-delay:210ms}.d4{animation-delay:280ms}
@media (prefers-reduced-motion:reduce){
  .r,[class*="d"]{animation:fade 1ms linear both !important}
  .kb{animation:none !important}
}

/* shared nav, deliberately minimal so it never competes with the fold */
.nav{
  position:absolute;top:0;left:0;right:0;z-index:6;
  display:flex;align-items:center;justify-content:space-between;
  padding:28px clamp(20px,4vw,56px);
}
.nav img{height:32px;width:auto}
.nav.on-dark img{filter:brightness(0) invert(1)}
.nav-links{display:flex;align-items:center;gap:clamp(14px,1.8vw,28px);font-size:15.5px;font-weight:600}
.nav-links a{text-decoration:none}
.nav.on-dark .nav-links a{color:rgba(255,255,255,.94)}
.nav.on-light .nav-links a{color:var(--ink)}
.nav-cta{background:var(--blue);color:#fff !important;padding:10px 18px;border-radius:999px;font-weight:500;font-size:14.5px}
.burger{display:none;flex-direction:column;gap:5px;background:0;border:0;padding:8px;cursor:pointer}
.burger span{display:block;width:24px;height:2px;border-radius:2px;background:currentColor}
.nav.on-dark .burger{color:#fff}.nav.on-light .burger{color:var(--ink)}
@media (max-width:940px){.nav-links{display:none}.burger{display:flex}}

.btn{
  display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-weight:500;font-size:16px;
  padding:15px 26px;border-radius:999px;background:var(--blue);color:#fff;
  transition:transform 180ms ease-out,box-shadow 180ms ease-out;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(46,107,230,.4)}
.btn-ghost{background:transparent;border:1px solid currentColor;padding:14px 25px}
.btn-ghost.on-dark{color:#fff}
.btn-ghost.on-light{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:clamp(26px,3vw,36px)}

/* ============================================================
   1 — CINEMATIC : full-bleed photo, one statement, one action
   ============================================================ */
.v1{position:relative;min-height:100vh;overflow:hidden;background:var(--navy)}
.v1 .kb{
  position:absolute;inset:0;background:url('/prototypes/life2.jpg') center/cover;
  animation:zoom 1400ms var(--ease) both;
}
.v1 .grad{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(4,7,14,.72) 0%,rgba(4,7,14,.18) 38%,rgba(4,7,14,.6) 74%,rgba(4,7,14,.94) 100%);
}
.v1 .inner{
  position:relative;z-index:3;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 clamp(20px,5vw,72px) clamp(48px,7vh,88px);max-width:1500px;margin:0 auto;
}
.v1 h1{
  margin:0;color:#fff;font-weight:700;letter-spacing:-.03em;
  font-size:clamp(36px,5.2vw,74px);line-height:1;max-width:21ch;
}
.v1 .sub{
  margin:clamp(18px,2.2vw,26px) 0 0;color:rgba(255,255,255,.86);font-weight:400;
  font-size:clamp(17px,1.7vw,23px);line-height:1.45;max-width:44ch;
}
.v1 .strip{
  display:flex;flex-wrap:wrap;gap:clamp(18px,3vw,44px);margin-top:clamp(30px,4vh,46px);
  padding-top:22px;border-top:1px solid rgba(255,255,255,.22);
}
.v1 .strip b{display:block;color:#fff;font-size:15.5px;font-weight:600;margin-bottom:3px}
.v1 .strip span{color:rgba(255,255,255,.6);font-size:13.5px;font-weight:500}

/* ============================================================
   2 — SPLIT : light copy panel, full-height photo, hard edge
   ============================================================ */
.v2{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,1fr);min-height:100vh;background:var(--paper)}
.v2 .pane{
  display:flex;flex-direction:column;justify-content:center;
  padding:clamp(104px,12vh,140px) clamp(24px,4.5vw,68px) clamp(40px,6vh,64px);
}
.v2 .kicker{
  display:inline-block;color:var(--blue);font-size:12.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;margin:0 0 20px;
}
.v2 h1{
  margin:0;color:var(--ink);font-weight:700;letter-spacing:-.028em;
  font-size:clamp(36px,4.4vw,62px);line-height:1.02;max-width:18ch;
}
.v2 .sub{margin:22px 0 0;color:var(--grey);font-size:clamp(16px,1.3vw,18.5px);line-height:1.6;max-width:46ch}
.v2 .facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:clamp(26px,3vw,36px);background:#DCDFE6;border-radius:14px;overflow:hidden;max-width:520px}
.v2 .facts div{background:#fff;padding:15px 17px}
.v2 .facts dt{margin:0 0 5px;color:#8A91A0;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.v2 .facts dd{margin:0;color:var(--ink);font-size:15px;font-weight:600}
.v2 .shot{position:relative;overflow:hidden}
.v2 .shot img{width:100%;height:100%;object-fit:cover;animation:zoom 1200ms var(--ease) both}
@media (max-width:900px){
  .v2{grid-template-columns:1fr}
  .v2 .shot{order:-1;min-height:42vh}
  .v2 .pane{padding-top:clamp(32px,5vh,48px)}
  .v2 .facts{grid-template-columns:1fr}
}

/* ============================================================
   3 — EDITORIAL : paper, headline first, wide photo band under
   ============================================================ */
.v3{min-height:100vh;background:var(--paper);padding:clamp(96px,11vh,124px) clamp(20px,5vw,72px) clamp(32px,4vh,52px)}
.v3 .wrap{max-width:1360px;margin:0 auto}
.v3 .top{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:end}
.v3 h1{
  margin:0;color:var(--ink);font-weight:700;letter-spacing:-.03em;
  font-size:clamp(34px,4.4vw,58px);line-height:1.02;max-width:22ch;
}
.v3 .sub{margin:0;color:var(--grey);font-size:clamp(16px,1.35vw,19px);line-height:1.6}
.v3 .band{
  position:relative;margin-top:clamp(22px,3vh,34px);border-radius:18px;overflow:hidden;
  aspect-ratio:26/7;animation:wipe 700ms var(--ease) 160ms both;
}
.v3 .band img{width:100%;height:100%;object-fit:cover}
.v3 .tag{
  position:absolute;left:18px;bottom:18px;z-index:2;
  display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;
  background:rgba(8,12,24,.62);color:#fff;font-size:13px;font-weight:500;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.v3 .dot{width:7px;height:7px;border-radius:50%;background:var(--blue-light);flex:none}
.v3 .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px;margin-top:clamp(24px,3vh,34px)}
.v3 .meta{display:flex;flex-wrap:wrap;gap:clamp(20px,3vw,48px)}
.v3 .meta b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:2px}
.v3 .meta span{color:#8A91A0;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
@media (max-width:900px){
  .v3 .top{grid-template-columns:1fr;gap:20px;align-items:start}
  .v3 .band{aspect-ratio:16/10}
}

/* ============================================================
   4 — TRIPTYCH : R&D -> pilot -> production, three photos
   ============================================================ */
.v4{position:relative;min-height:100vh;background:var(--navy);overflow:hidden}
.v4 .grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}
.v4 .cell{position:relative;overflow:hidden}
/* The three source photos are exposed very differently (two bright lab shots
   either side of a dark fermentation hall), so each gets its own brightness to
   land on one level. A screen-blend tint was tried first and washed the outer
   two out — a flat navy overlay holds the grading instead. */
.v4 .cell img{
  width:100%;height:100%;object-fit:cover;animation:zoom 1500ms var(--ease) both;
  filter:grayscale(.5) contrast(1.04);
}
.v4 .cell:nth-child(1) img{filter:grayscale(.5) contrast(1.04) brightness(.4)}
.v4 .cell:nth-child(2) img{filter:grayscale(.5) contrast(1.04) brightness(.92)}
.v4 .cell:nth-child(3) img{filter:grayscale(.5) contrast(1.04) brightness(.44)}
.v4 .cell::after{content:"";position:absolute;inset:0;background:rgba(10,20,44,.34)}
.v4 .cell + .cell::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:rgba(255,255,255,.16);z-index:3}
.v4 .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,7,14,.6) 0%,rgba(4,7,14,.42) 40%,rgba(4,7,14,.86) 100%)}
.v4 .inner{
  position:relative;z-index:4;min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  padding:clamp(100px,12vh,140px) clamp(20px,5vw,72px) clamp(40px,6vh,64px);max-width:1500px;margin:0 auto;
}
.v4 h1{
  margin:0;color:#fff;font-weight:700;letter-spacing:-.03em;text-align:center;
  font-size:clamp(38px,6vw,82px);line-height:.99;max-width:20ch;margin-inline:auto;
}
.v4 .sub{
  margin:clamp(18px,2.2vw,26px) auto 0;color:rgba(255,255,255,.84);text-align:center;
  font-size:clamp(16px,1.5vw,20px);line-height:1.5;max-width:52ch;
}
.v4 .actions{justify-content:center}
.v4 .stages{
  display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2vw,28px);
  margin-top:clamp(34px,5vh,58px);padding-top:24px;border-top:1px solid rgba(255,255,255,.2);
}
.v4 .stages b{display:block;color:#fff;font-size:15.5px;font-weight:600;margin-bottom:4px}
.v4 .stages span{color:rgba(255,255,255,.62);font-size:13.5px;font-weight:500;line-height:1.45}
@media (max-width:900px){
  .v4 .grid{grid-template-columns:1fr}
  .v4 .cell:nth-child(n+2){display:none}
  .v4 .stages{grid-template-columns:1fr;gap:14px}
}

/* ============================================================
   PICKER — harness chrome. Verbatim from the skill spec.
   ============================================================ */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>

<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Cinematic</button>
  <button class="proto-picker-item">Split</button>
  <button class="proto-picker-item">Editorial</button>
  <button class="proto-picker-item">Triptych</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
/* Copy is trimmed hard from the audit deck: round 1 put a 330-character lead in
   every hero, which is what made them all read as a wall of text. */
const H1 = 'Know what is happening in your process';
const H1_TAIL = 'while you can still act.';
const SUB_LONG = 'Q‑Tector puts guided at-line assays next to the fermenter, so glucose and sucrose results arrive while the run is still yours to change.';
const SUB_SHORT = 'Guided at-line assays, next to the fermenter — results while the run is still yours to change.';
const CTA1 = 'See how Q‑Tector works';
const CTA2 = 'Discuss your process';

const nav = (tone) => `
  <header class="nav on-${tone}">
    <a href="#"><img src="/assets/SGPT_logo.png" alt="SG Papertronics"/></a>
    <span class="nav-links">
      <a href="#">Technology</a><a href="#">Applications</a><a href="#">Investors</a><a href="#">News</a>
      <a class="nav-cta" href="#">Talk to us</a>
    </span>
    <button class="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  </header>`;

/* ---------- 1 — CINEMATIC ---------- */
const cinematic = () => `
<section class="v1">
  <div class="kb"></div>
  <div class="grad"></div>
  ${nav('dark')}
  <div class="inner">
    <h1 class="r">${H1}<br/>— ${H1_TAIL}</h1>
    <p class="sub r d1">${SUB_LONG}</p>
    <div class="actions r d2">
      <a class="btn" href="#">${CTA1}</a>
      <a class="btn btn-ghost on-dark" href="#">${CTA2}</a>
    </div>
    <div class="strip r d3">
      <div><b>Glucose · Sucrose</b><span>What it measures today</span></div>
      <div><b>Culture media</b><span>Sample matrix</span></div>
      <div><b>At-line</b><span>Next to the run, not in a queue</span></div>
    </div>
  </div>
</section>`;

/* ---------- 2 — SPLIT ---------- */
const split = () => `
<section class="v2">
  ${nav('light')}
  <div class="pane">
    <span class="kicker r">At-line analytics for biological processes</span>
    <h1 class="r d1">${H1} — ${H1_TAIL}</h1>
    <p class="sub r d2">${SUB_LONG}</p>
    <dl class="facts r d3">
      <div><dt>Measures today</dt><dd>Glucose and sucrose</dd></div>
      <div><dt>In</dt><dd>Culture media</dd></div>
      <div><dt>Where</dt><dd>At-line</dd></div>
      <div><dt>Supports</dt><dd>Process decisions</dd></div>
    </dl>
    <div class="actions r d4">
      <a class="btn" href="#">${CTA1}</a>
      <a class="btn btn-ghost on-light" href="#">${CTA2}</a>
    </div>
  </div>
  <div class="shot"><img src="/prototypes/lifecycle-rollout.jpg" alt="Filling line in production"/></div>
</section>`;

/* ---------- 3 — EDITORIAL ---------- */
const editorial = () => `
<section class="v3">
  ${nav('light')}
  <div class="wrap">
    <div class="top">
      <h1 class="r">${H1} — ${H1_TAIL}</h1>
      <p class="sub r d1">${SUB_LONG}</p>
    </div>
    <figure class="band">
      <img src="/prototypes/life2.jpg" alt="Fermentation hall"/>
      <figcaption class="tag"><span class="dot"></span>Current analytical focus: glucose and sucrose in culture media</figcaption>
    </figure>
    <div class="row">
      <div class="meta r d2">
        <div><span>Measures</span><b>Glucose · Sucrose</b></div>
        <div><span>Matrix</span><b>Culture media</b></div>
        <div><span>Where</span><b>At-line</b></div>
      </div>
      <div class="actions r d3" style="margin-top:0">
        <a class="btn" href="#">${CTA1}</a>
        <a class="btn btn-ghost on-light" href="#">${CTA2}</a>
      </div>
    </div>
  </div>
</section>`;

/* ---------- 4 — TRIPTYCH ---------- */
const triptych = () => `
<section class="v4">
  <div class="grid">
    <div class="cell"><img src="/prototypes/lifecycle-pilot.jpg" alt="R&D bench work"/></div>
    <div class="cell"><img src="/prototypes/life2.jpg" alt="Pilot fermentation hall"/></div>
    <div class="cell"><img src="/prototypes/lifecycle-rollout.jpg" alt="Production line"/></div>
  </div>
  <div class="veil"></div>
  ${nav('dark')}
  <div class="inner">
    <h1 class="r">${H1} — ${H1_TAIL}</h1>
    <p class="sub r d1">${SUB_SHORT}</p>
    <div class="actions r d2">
      <a class="btn" href="#">${CTA1}</a>
      <a class="btn btn-ghost on-dark" href="#">${CTA2}</a>
    </div>
    <div class="stages r d3">
      <div><b>R&D — learn</b><span>Compare strains, media and conditions.</span></div>
      <div><b>Pilot — validate</b><span>Prove the workflow on real runs.</span></div>
      <div><b>Production — standardise</b><span>Monitor trends, compare batches.</span></div>
    </div>
  </div>
</section>`;

/* ---------- picker wiring ---------- */
const variants = [cinematic, split, editorial, triptych];

const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
