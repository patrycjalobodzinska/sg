<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SG Papertronics — hero, round 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   PROTOTYPE SURFACE — round 4. Not production. Delete with folder.

   Rounds 1-2 explored photography (Photographic/Diagram/Data/Editorial,
   Cinematic/Split/Editorial/Triptych) — none shipped, because every
   product shot we own carries Beer-o-Meter branding, which is exactly
   what audit P0 says must leave the hero.
   Round 3 removed the photo (Instrument/Live run/Fit check/Ledger) and
   asked what the fold looks like with no image at all.

   Round 4 asks a different question again: not "what does the fold
   SHOW" but "what JOB does the fold do". Four answers, four axes:
     1 Gap      — the fold argues the problem before naming the product
     2 Lineage  — the fold answers "who are you", not "what is this"
     3 Reel     — the fold plays the workflow instead of describing it
     4 Short    — the fold refuses to be a poster and gets out of the way

   Tokens mirrored from app/globals.css + landing-markup.ts.
   Montserrat kept deliberately: the audit also proposes Manrope/Inter
   (ch. 11), but switching type here would confound the layout decision
   with the typeface decision.
   ============================================================ */
:root{
  --navy:#0E1526; --navy-2:#14161C; --ink:#1B2233;
  --blue:#2E6BE6; --blue-lt:#6AA6FF; --blue-pale:#E9F0FC;
  --body:#4A5165; --muted:#8990A0;
  --paper:#F3F5F9; --line:#E7EAF0;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{overflow-x:hidden}
body{font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;background:#fff;color:var(--ink)}
a{text-decoration:none;color:inherit}
#stage{min-height:100vh}
.v{min-height:100vh;display:flex;flex-direction:column}

/* ---------- shared nav (context, not the thing being judged) ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;padding:26px clamp(20px,4vw,56px);gap:24px}
.nav img{height:26px;width:auto}
.nav > a{display:flex;align-items:center;min-height:44px}
.nav-links{display:flex;align-items:center;gap:clamp(14px,2vw,30px);font-size:15.5px;font-weight:600}
.nav-cta{padding:10px 19px;border-radius:999px;font-size:14.5px;font-weight:500}
.on-dark img{filter:brightness(0) invert(1)}
.on-dark .nav-links{color:rgba(255,255,255,.92)}
.on-dark .nav-cta{background:var(--blue);color:#fff}
.on-light .nav-links{color:var(--ink)}
.on-light .nav-cta{background:var(--navy);color:#fff}
.nav-burger{display:none;flex-direction:column;gap:5px;background:transparent;border:0;padding:11px;cursor:pointer;min-width:44px;min-height:44px;align-items:center;justify-content:center}
.nav-burger span{width:22px;height:2px;border-radius:2px;display:block}
.on-light .nav-burger span{background:var(--navy)}
.on-dark .nav-burger span{background:#fff}
@media(max-width:900px){.nav-links{display:none}.nav-burger{display:flex}}

/* ---------- shared atoms ---------- */
.eyebrow{display:inline-flex;max-width:100%;align-items:center;gap:9px;font-size:13.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue-lt);flex:none}
.focus{display:inline-flex;max-width:100%;align-items:center;gap:9px;font-size:14.5px;font-weight:500;line-height:1.35}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px}
.cta-solid{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:14px 24px;border-radius:999px;background:var(--blue);color:#fff;font-size:16px;font-weight:500;transition:transform .18s ease-out,box-shadow .18s ease-out}
.cta-solid:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(46,107,230,.34)}
.cta-quiet{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:16px;font-weight:500;transition:gap .18s ease-out}
.cta-quiet > span{padding-bottom:4px;border-bottom:1px solid currentColor}
.cta-quiet:hover{gap:13px}
.arr{flex:none}

/* entrances — ease-out, transform/opacity only */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.r{animation:rise .62s var(--ease) both}
.r1{animation-delay:.04s}.r2{animation-delay:.12s}.r3{animation-delay:.2s}
.r4{animation-delay:.28s}.r5{animation-delay:.36s}.r6{animation-delay:.44s}

/* seam — proves the fold hands off to the next section */
.seam{padding:44px clamp(20px,4vw,56px) 90px;border-top:1px solid var(--line);background:#fff}
.seam p{margin:0 auto;max-width:680px;text-align:center;color:var(--body);font-size:17px;line-height:1.6}
.seam b{color:var(--ink);font-weight:600}

/* ============================================================
   1 — GAP : the fold argues the problem before naming the product
   ============================================================ */
.v1{background:#fff}
.v1 .fold{flex:1;display:grid;grid-template-columns:1fr 1.05fr;align-items:center;gap:clamp(28px,4vw,68px);padding:clamp(16px,2.4vw,32px) clamp(20px,4vw,56px) clamp(44px,5vw,80px);max-width:1460px;margin:0 auto;width:100%}
.v1 .eyebrow{color:var(--blue)}
.v1 h1{margin:16px 0 0;font-size:clamp(32px,4.2vw,56px);line-height:1.04;letter-spacing:-.025em;font-weight:600;color:var(--navy);max-width:min(15ch,100%)}
.v1 h1 em{font-style:normal;color:var(--body);font-weight:400}
.v1 p.sub{margin:22px 0 0;max-width:min(48ch,100%);color:var(--body);font-size:17px;line-height:1.6}
.v1 .focus{margin:24px 0 0;padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink)}
.v1 .cta-row{margin-top:32px}
.v1 .cta-quiet{color:var(--navy)}

.v1 .tl{padding:clamp(24px,3vw,38px) clamp(20px,2.6vw,34px) clamp(20px,2.4vw,30px);border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#fff,#FBFCFE)}
.v1 .tl-cap{margin:0 0 26px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.v1 .track{position:relative;margin:0 0 30px;padding-left:0}
.v1 .track:last-of-type{margin-bottom:16px}
.v1 .track h3{margin:0 0 14px;font-size:14.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:9px}
.v1 .track h3 i{font-style:normal;width:8px;height:8px;border-radius:50%;flex:none}
.v1 .lab h3 i{background:#C9CEDA}
.v1 .now h3 i{background:var(--blue)}
.v1 .line{position:relative;height:2px;border-radius:2px;background:var(--line)}
.v1 .lab .line{background:repeating-linear-gradient(90deg,#DCE0E9 0 7px,transparent 7px 14px)}
.v1 .now .line{background:var(--blue-pale)}
.v1 .fill{position:absolute;left:0;top:0;height:100%;border-radius:2px;background:var(--blue);transform-origin:left center}
.v1 .pin{position:absolute;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;background:#fff;border:2.5px solid #C2C8D6}
.v1 .now .pin{border-color:var(--blue)}
.v1 .pin.solid{background:var(--blue);border-color:var(--blue)}
.v1 .tag{position:absolute;top:22px;transform:translateX(-50%);white-space:nowrap;font-size:12.5px;line-height:1.35;color:var(--body);text-align:center}
.v1 .tag b{display:block;font-weight:600;color:var(--ink);font-size:13px}
.v1 .tag-l{transform:none;left:0;text-align:left}
.v1 .tag-r{transform:none;right:0;left:auto;text-align:right}
.v1 .track{padding-bottom:52px}
.v1 .band{position:relative;margin-top:4px;padding:13px 16px;border-radius:11px;background:var(--blue-pale);color:#1B4EA8;font-size:13.5px;line-height:1.45;font-weight:500}
.v1 .band b{font-weight:600}
.v1 .axis{display:flex;justify-content:space-between;margin-top:14px;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
/* motion: the lab result lands late — that lateness IS the argument */
.v1 .now .fill{animation:grow .5s var(--ease) .45s both}
.v1 .now .pin.end{animation:pop .34s var(--ease) .9s both}
.v1 .lab .pin.end{animation:pop .34s var(--ease) 1.75s both}
.v1 .lab .tag-r{animation:fade .4s ease-out 1.85s both}
.v1 .now .tag-r{left:9%;right:auto;margin-left:16px;text-align:left;animation:fade .4s ease-out 1s both}
.v1 .band{animation:rise .5s var(--ease) 2.15s both}
@media(max-width:960px){.v1 .fold{grid-template-columns:1fr;align-content:center;padding-top:8px}.v1 .tl{order:2}}

/* ============================================================
   2 — LINEAGE : the fold answers "who are you", not "what is this"
   Audit ch. 2 (P0): Beer-o-Meter must never appear without the
   qualifier. Here the hierarchy IS the hero graphic.
   ============================================================ */
.v2{background:var(--navy);color:#fff}
.v2 .fold{flex:1;display:grid;grid-template-columns:1.02fr .98fr;align-items:center;gap:clamp(28px,4vw,72px);padding:clamp(16px,2.4vw,32px) clamp(20px,4vw,56px) clamp(48px,6vw,88px);max-width:1440px;margin:0 auto;width:100%}
.v2 .eyebrow{color:rgba(255,255,255,.66)}
.v2 h1{margin:18px 0 0;font-size:clamp(32px,4.4vw,58px);line-height:1.04;letter-spacing:-.025em;font-weight:600;max-width:min(15ch,100%)}
.v2 h1 em{font-style:normal;color:rgba(255,255,255,.6);font-weight:400}
.v2 p.sub{margin:22px 0 0;max-width:min(48ch,100%);color:rgba(255,255,255,.74);font-size:17px;line-height:1.6}
.v2 .focus{margin:24px 0 0;padding:10px 16px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(255,255,255,.05);color:#fff}
.v2 .cta-row{margin-top:32px}
.v2 .cta-quiet{color:#fff}
.v2 .cta-quiet > span{border-color:rgba(255,255,255,.45)}

.v2 .tiers{position:relative}
.v2 .tier{position:relative;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:rgba(255,255,255,.04);padding:20px 22px}
.v2 .tier + .tier{margin-top:12px}
.v2 .t-co{padding-bottom:14px}
.v2 .t-lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.v2 .t-name{margin-top:8px;font-size:clamp(19px,1.9vw,24px);font-weight:600;letter-spacing:-.015em}
.v2 .t-desc{margin-top:7px;font-size:14px;line-height:1.55;color:rgba(255,255,255,.68);max-width:44ch}
.v2 .nest{margin-top:16px;padding-left:clamp(14px,2vw,26px);border-left:1px solid rgba(255,255,255,.14)}
.v2 .t-plat{border-color:rgba(106,166,255,.42);background:rgba(46,107,230,.14)}
.v2 .t-plat .t-lbl{color:var(--blue-lt)}
.v2 .apps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.v2 .app{padding:14px 15px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.03)}
.v2 .app .t-name{font-size:15.5px;margin-top:7px}
.v2 .app .t-desc{font-size:12.5px;margin-top:6px;color:rgba(255,255,255,.6)}
.v2 .app .t-lbl{font-size:10px;letter-spacing:.09em}
.v2 .tier{animation:rise .58s var(--ease) both}
.v2 .t-co{animation-delay:.3s}
.v2 .t-plat{animation-delay:.42s}
.v2 .app{animation:rise .5s var(--ease) both}
.v2 .app:nth-child(1){animation-delay:.58s}
.v2 .app:nth-child(2){animation-delay:.66s}
@media(max-width:960px){.v2 .fold{grid-template-columns:1fr;align-content:center}.v2 .apps{grid-template-columns:1fr}}

/* ============================================================
   3 — REEL : the fold plays the workflow instead of describing it
   The audit's B3 spine (Sample -> Guided assay -> Result -> Trend ->
   Process decision) promoted out of a mid-page section into the fold.
   ============================================================ */
.v3{background:linear-gradient(180deg,#fff 0%,var(--paper) 100%)}
.v3 .fold{flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(14px,2vw,28px) clamp(20px,4vw,56px) clamp(36px,4vw,64px);max-width:1400px;margin:0 auto;width:100%}
.v3 .top{max-width:min(62ch,100%)}
.v3 .eyebrow{color:var(--blue)}
.v3 h1{margin:14px 0 0;font-size:clamp(30px,3.9vw,52px);line-height:1.05;letter-spacing:-.025em;font-weight:600;color:var(--navy);max-width:min(16ch,100%)}
.v3 h1 em{font-style:normal;color:var(--body);font-weight:400}
.v3 .focus{margin:18px 0 0;color:var(--body)}
.v3 .reel{margin:clamp(22px,2.6vw,34px) 0 0;border:1px solid var(--line);border-radius:20px;background:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 34px rgba(16,24,40,.05)}
.v3 .panes{position:relative;min-height:214px}
.v3 .pane{position:absolute;inset:0;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:clamp(20px,3vw,44px);padding:clamp(22px,2.8vw,36px) clamp(22px,3vw,40px);opacity:0;pointer-events:none;transition:opacity .22s ease-out}
.v3 .pane[data-on]{opacity:1;pointer-events:auto}
.v3 .glyph{width:clamp(96px,11vw,132px);height:clamp(96px,11vw,132px);border-radius:20px;background:var(--blue-pale);display:flex;align-items:center;justify-content:center;flex:none}
.v3 .glyph svg{width:56%;height:56%;overflow:visible}
.v3 .pane .st{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.v3 .pane h2{margin:9px 0 0;font-size:clamp(20px,2.1vw,27px);font-weight:600;letter-spacing:-.018em;color:var(--navy)}
.v3 .pane p{margin:9px 0 0;max-width:52ch;color:var(--body);font-size:15.5px;line-height:1.6}
.v3 .bignum{font-size:clamp(30px,3.4vw,44px);font-weight:600;letter-spacing:-.02em;color:var(--navy);font-variant-numeric:tabular-nums}
.v3 .bignum span{font-size:.45em;font-weight:500;color:var(--body);margin-left:5px}
.v3 .stops{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.v3 .stop{position:relative;flex:1;min-width:0;background:transparent;border:0;border-left:1px solid var(--line);padding:13px 10px 14px;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;transition:color .15s ease-out,background-color .15s ease-out;overflow:hidden}
.v3 .stop:first-child{border-left:0}
.v3 .stop:hover{color:var(--ink);background:#FAFBFD}
.v3 .stop:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.v3 .stop[aria-selected="true"]{color:var(--navy)}
.v3 .stop .bar{position:absolute;left:0;right:0;top:0;height:2px;background:var(--blue);transform:scaleX(0);transform-origin:left center}
.v3 .stop[aria-selected="true"] .bar{transform:scaleX(1);transition:transform 2.6s linear}
.v3 .cta-row{margin-top:clamp(22px,2.4vw,30px)}
.v3 .cta-quiet{color:var(--navy)}
.v3 .reel{animation:rise .6s var(--ease) .28s both}
@media(max-width:820px){
  .v3 .pane{grid-template-columns:1fr;gap:16px;align-content:center}
  .v3 .panes{min-height:290px}
  .v3 .stops{flex-wrap:wrap}
  .v3 .stop{flex:1 0 33.33%;border-top:1px solid var(--line);min-height:44px}
}
@media(prefers-reduced-motion:reduce){
  .v3 .stop[aria-selected="true"] .bar{transition:none}
}

/* ============================================================
   4 — SHORT : the fold refuses to be a poster
   Audit ch. 11 on decoration, answered with vertical economy: the
   fold is ~64vh, so the first real content is visible without a
   scroll. Nothing above the fold that is not load-bearing.
   ============================================================ */
.v4{background:#fff}
.v4 .fold{min-height:64vh;display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,4vw,54px) clamp(20px,4vw,56px) clamp(30px,3.4vw,46px);max-width:1240px;margin:0 auto;width:100%}
.v4 .eyebrow{color:var(--blue)}
.v4 h1{margin:20px 0 0;font-size:clamp(36px,6vw,84px);line-height:1;letter-spacing:-.035em;font-weight:600;color:var(--navy);max-width:min(17ch,100%)}
.v4 h1 em{font-style:normal;color:#A9B0C0;font-weight:400}
.v4 .focus{margin:28px 0 0;color:var(--body)}
.v4 .cta-row{margin-top:30px}
.v4 .cta-quiet{color:var(--navy)}
.v4 .next{border-top:1px solid var(--line);background:var(--paper)}
.v4 .next-in{max-width:1240px;margin:0 auto;padding:clamp(30px,3.6vw,52px) clamp(20px,4vw,56px) clamp(46px,5vw,74px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,64px);align-items:start}
.v4 .next h2{margin:0;font-size:clamp(22px,2.5vw,32px);font-weight:600;letter-spacing:-.02em;color:var(--navy);line-height:1.15;max-width:18ch}
.v4 .next p{margin:0;color:var(--body);font-size:16.5px;line-height:1.62;max-width:56ch}
.v4 .next p + p{margin-top:14px;font-size:14.5px}
@media(max-width:900px){.v4 .next-in{grid-template-columns:1fr}.v4 .fold{min-height:72vh}}

/* ---------- reduced motion, all variants ---------- */
@media(prefers-reduced-motion:reduce){
  .r,.v1 .now .fill,.v1 .pin.end,.v1 .tag-r,.v1 .band,.v2 .tier,.v2 .app,.v3 .reel{
    animation:none!important;opacity:1!important;transform:none!important
  }
  .v1 .now .fill{transform:scaleX(1)!important}
}

/* ============================================================
   PICKER — harness chrome. Verbatim from the skill spec.
   ============================================================ */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,.85)}
.proto-picker-item:active{transform:scale(.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}
.proto-picker-replay{padding:0 10px;font-size:14px}
.proto-picker[data-position="top"]{bottom:auto;top:24px}
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Gap</button>
  <button class="proto-picker-item">Lineage</button>
  <button class="proto-picker-item">Reel</button>
  <button class="proto-picker-item">Short</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">&#8635;</button>
</nav>

<script>
/* Audit copy deck, ch. 5 — verbatim where reused. Nothing here may
   assert a claim the audit put behind a publication condition (no
   "<5 min", no "zero calibration") until the client confirms it per
   assay (open questions B1/B2). */
const COPY = {
  eyebrow: "At-line analytics for biological processes",
  h1a: "Know what is happening in your process",
  h1b: "— while you can still act.",
  sub: "Q‑Tector combines ready-to-use assay pods, a compact reader and guided digital workflows to generate comparable glucose and sucrose results close to the fermenter or bioreactor. Use the data to compare runs, refine feed strategies and carry process knowledge from R&D to production.",
  focus: "Current analytical focus: glucose and sucrose in culture media",
  cta1: "See how Q‑Tector works",
  cta2: "Discuss your process"
};
/* Intent routing per audit ch. 12 — every hero CTA carries its context. */
const HREF1 = "/technology";
const HREF2 = "/contact?intent=pilot&source_page=home&source_cta=hero&locale=en";

/* ---------- 3 — REEL ----------
   Axis: interaction model. The fold plays the workflow the audit asks
   for in B3 (Sample -> Guided assay -> Quantitative result -> Trend ->
   Process decision) rather than asserting it in prose. Auto-advances,
   pauses on hover/focus, fully operable by keyboard as a tablist.
   Numbers are ILLUSTRATIVE placeholders pending open question A. */
const STOPS = [
  { k:"Sample",
    t:"A sample from the running process",
    d:"Drawn at the fermenter or bioreactor. No shipping, no queue, no waiting for a slot in someone else's schedule.",
    g:'<svg viewBox="0 0 48 48" fill="none" stroke="#2E6BE6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 5h10"/><path d="M21 5v17L14 38a5 5 0 0 0 4.6 7h10.8a5 5 0 0 0 4.6-7L27 22V5"/><path d="M17 31h14"/></svg>' },
  { k:"Guided assay",
    t:"A ready-to-use assay pod",
    d:"The digital workflow walks the operator through it step by step, so the same procedure is run the same way on every shift.",
    g:'<svg viewBox="0 0 48 48" fill="none" stroke="#2E6BE6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="12" width="32" height="24" rx="4"/><path d="M16 22h9"/><path d="M16 28h6"/><circle cx="33" cy="25" r="4.5"/></svg>' },
  { k:"Result",
    t:"A quantitative result, at the line",
    d:"Glucose and sucrose in culture media, in units your process team already works in.",
    g:'<svg viewBox="0 0 48 48" fill="none" stroke="#2E6BE6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="10" width="34" height="28" rx="4"/><path d="M14 30v-6"/><path d="M21 30V19"/><path d="M28 30v-9"/><path d="M35 30V16"/></svg>',
    extra:'<div class="bignum">4.2<span>g/L glucose</span></div>' },
  { k:"Trend",
    t:"A run you can compare to the last one",
    d:"Structured data instead of a photographed notebook page &mdash; comparable across experiments, strains and scales.",
    g:'<svg viewBox="0 0 48 48" fill="none" stroke="#2E6BE6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 39h34"/><path d="M11 30c6 0 8-14 14-14s8 9 13 5"/><circle cx="38" cy="21" r="3" fill="#2E6BE6" stroke="none"/></svg>' },
  { k:"Process decision",
    t:"A decision made during the run",
    d:"Adjust the feed, hold the temperature, harvest now or later &mdash; while there is still a run to adjust.",
    g:'<svg viewBox="0 0 48 48" fill="none" stroke="#2E6BE6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 6v13"/><path d="M24 19 13 42h22z"/><path d="M14 12l4 4"/><path d="M34 12l-4 4"/></svg>' }
];

function reel(){
  const panes = STOPS.map(function(s,i){
    return '<div class="pane" id="reel-pane-' + i + '" role="tabpanel" aria-labelledby="reel-stop-' + i + '"' + (i===0?' data-on':'') + (i===0?'':' hidden') + '>' +
      '<div class="glyph">' + s.g + '</div>' +
      '<div><div class="st">Step ' + (i+1) + ' of ' + STOPS.length + '</div>' +
        '<h2>' + s.t + '</h2>' +
        (s.extra || '') +
        '<p>' + s.d + '</p></div>' +
    '</div>';
  }).join('');

  const stops = STOPS.map(function(s,i){
    return '<button class="stop" id="reel-stop-' + i + '" role="tab" aria-controls="reel-pane-' + i + '" aria-selected="' + (i===0) + '" tabindex="' + (i===0?0:-1) + '">' +
      '<span class="bar" aria-hidden="true"></span>' + s.k + '</button>';
  }).join('');

  return '<div class="v v3">' + nav("on-light") + `
  <div class="fold">
    <div class="top">
      <div class="eyebrow r r1"><span class="dot"></span>${COPY.eyebrow}</div>
      <h1 class="r r2">${COPY.h1a} <em>${COPY.h1b}</em></h1>
      <p class="focus r r3"><span class="dot" aria-hidden="true"></span>${COPY.focus}</p>
    </div>

    <div class="reel" id="reel">
      <div class="panes">${panes}</div>

    </div>

    ${ctas()}
  </div>` + seam() + '</div>';

/* Reel behaviour. Registered per-mount; the harness clears the previous
   timer before re-rendering so replay never stacks intervals. */
let reelTimer = null;
function initReel(){
  const root = document.getElementById('reel');
  if (!root) return;
  const tabs  = [].slice.call(root.querySelectorAll('.stop'));
  const panes = [].slice.call(root.querySelectorAll('.pane'));
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i = 0;

  function show(n){
    i = (n + tabs.length) % tabs.length;
    tabs.forEach(function(t,j){
      const on = j === i;
      t.setAttribute('aria-selected', String(on));
      t.tabIndex = on ? 0 : -1;
      /* Bars are driven explicitly: passed stops stay full, future stops empty,
         and the current one is handed back to CSS so it fills over the dwell. */
      const b = t.querySelector('.bar');
      b.style.transition = 'none';
      b.style.transform = j < i ? 'scaleX(1)' : 'scaleX(0)';
      void b.offsetWidth;
      b.style.transition = '';
      if (on) b.style.transform = '';
    });
    panes.forEach(function(p,j){
      const on = j === i;
      p.toggleAttribute('data-on', on);
      p.hidden = !on;
    });
  }

  function stop(){ if (reelTimer) { clearInterval(reelTimer); reelTimer = null; } }
  function play(){ if (still) return; stop(); reelTimer = setInterval(function(){ show(i + 1); }, 2600); }
  /* Pause freezes the bar at its current width rather than snapping it full. */
  function pause(){
    const b = tabs[i].querySelector('.bar');
    const m = getComputedStyle(b).transform.match(/matrix\(([-\d.]+)/);
    stop();
    root.setAttribute('data-paused','');
    b.style.transition = 'none';
    b.style.transform = 'scaleX(' + (m ? m[1] : 1) + ')';
  }
  function resume(){ const b = tabs[i].querySelector('.bar'); b.style.transition=''; b.style.transform=''; root.removeAttribute('data-paused'); play(); }
  /* A deliberate pick stops the reel; the bar then reads as a selection
     marker (full) rather than a countdown that never finishes. */
  function pick(n){
    stop(); root.setAttribute('data-paused','');
    show(n);
    const b = tabs[i].querySelector('.bar');
    b.style.transition = 'none'; b.style.transform = 'scaleX(1)';
  }

  tabs.forEach(function(t,j){
    t.addEventListener('click', function(){ root.dataset.locked = '1'; pick(j); });
    t.addEventListener('keydown', function(e){
      let n = null;
      if (e.key === 'ArrowRight') n = j + 1;
      else if (e.key === 'ArrowLeft') n = j - 1;
      else if (e.key === 'Home') n = 0;
      else if (e.key === 'End') n = tabs.length - 1;
      if (n === null) return;
      e.preventDefault();
      e.stopPropagation();           /* don't let the picker steal the arrows */
      root.dataset.locked = '1'; pick(n); tabs[i].focus();
    });
  });

  root.addEventListener('mouseenter', function(){ pause(); });
  root.addEventListener('mouseleave', function(){ if (!root.dataset.locked) resume(); });
  root.addEventListener('focusin',  function(){ pause(); root.dataset.locked = '1'; });

  show(0);
  play();
}

/* ---------- 4 — SHORT ----------

   the objection taken literally. The fold is 64vh: eyebrow, headline,

/* ============================================================
   PICKER WIRING — behaviour contract from the skill spec.
   The one addition is INIT[]: a variant may register a mount hook
   (Reel needs one). Timers are torn down before every re-mount.
   ============================================================ */
const variants = [gap, lineage, reel, short];
const INIT = { 2: initReel };

const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [].slice.call(picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)'));
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight(){
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = 'translateX(' + el.offsetLeft + 'px)';
}

function mount(i){
  if (reelTimer) { clearInterval(reelTimer); reelTimer = null; }
  stage.innerHTML = '';
  requestAnimationFrame(function(){
    stage.innerHTML = variants[i]();
    if (INIT[i]) INIT[i]();
  });
}

function setActive(i){
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach(function(el,j){
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current','true'); else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach(function(el,i){ el.addEventListener('click', function(){ setActive(i); }); });
if (replay) replay.addEventListener('click', function(){ mount(current); });
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', function(e){
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(function(){ requestAnimationFrame(function(){ picker.setAttribute('data-ready',''); }); });
</script>
