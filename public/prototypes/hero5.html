<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SG Papertronics — hero, round 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   PROTOTYPE SURFACE — round 5. Not production. Delete with folder.

   Correction to rounds 3 and 4: those assumed the hero could carry no
   photograph, because audit P0 says the Beer-o-Meter branding must
   leave the hero. That conflated two things. We DO have usable imagery:
     - qtector-hero-retouched.jpg  device, branding retouched out
     - life2.jpg                   fermentation hall, cinematic, dark
     - photos/reactor-skid.jpg     production skid, cool and technical
   Round 5 is photography-led; each variant is a different relationship
   between image and copy.

   Tokens mirrored from app/globals.css + landing-markup.ts.
   ============================================================ */
:root{
  --navy:#0E1526; --ink:#1B2233;
  --blue:#2E6BE6; --blue-lt:#6AA6FF; --blue-pale:#E9F0FC;
  --body:#4A5165; --muted:#8990A0;
  --paper:#F3F5F9; --line:#E7EAF0;
  --ease:cubic-bezier(.2,.7,.2,1);
  --img-hall:url('/prototypes/life2.jpg');
  --img-device:url('/prototypes/qtector-hero-retouched.jpg');
  --img-skid:url('/prototypes/photos/reactor-skid.jpg');
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{overflow-x:hidden;font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;background:#fff;color:var(--ink)}
a{text-decoration:none;color:inherit}
#stage{min-height:100vh}
.v{min-height:100vh;display:flex;flex-direction:column}
.frame{min-height:100vh}

/* ---------- shared nav ---------- */
.nav{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:26px clamp(20px,4vw,56px);gap:24px}
.nav img{height:26px;width:auto}
.nav > a{display:flex;align-items:center;min-height:44px}
.nav-links{display:flex;align-items:center;gap:clamp(14px,2vw,30px);font-size:15.5px;font-weight:600}
.nav-cta{padding:11px 20px;border-radius:999px;font-size:14.5px;font-weight:500;min-height:44px;display:inline-flex;align-items:center}
.on-dark img{filter:brightness(0) invert(1)}
.on-dark .nav-links{color:rgba(255,255,255,.94)}
.on-dark .nav-cta{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.on-light .nav-links{color:var(--ink)}
.on-light .nav-cta{background:var(--navy);color:#fff}
.nav-burger{display:none;flex-direction:column;gap:5px;background:transparent;border:0;padding:11px;cursor:pointer;min-width:44px;min-height:44px;align-items:center;justify-content:center}
.nav-burger span{width:22px;height:2px;border-radius:2px;display:block}
.on-light .nav-burger span{background:var(--navy)}
.on-dark .nav-burger span{background:#fff}
@media(max-width:900px){.nav-links{display:none}.nav-burger{display:flex}}

/* ---------- shared atoms ---------- */
.eyebrow{display:inline-flex;max-width:100%;align-items:center;gap:9px;font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue-lt);flex:none;box-shadow:0 0 0 4px rgba(106,166,255,.22)}
.focus{display:inline-flex;max-width:100%;align-items:center;gap:10px;font-size:14.5px;font-weight:500;line-height:1.35;padding:11px 17px;border-radius:999px}
.focus-glass{border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.09);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px}
.cta-solid{display:inline-flex;align-items:center;gap:9px;min-height:48px;padding:15px 26px;border-radius:999px;background:var(--blue);color:#fff;font-size:16px;font-weight:500;box-shadow:0 10px 30px rgba(46,107,230,.34);transition:transform .18s ease-out,box-shadow .18s ease-out}
.cta-solid:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(46,107,230,.46)}
.cta-quiet{display:inline-flex;align-items:center;gap:8px;min-height:48px;font-size:16px;font-weight:500;transition:gap .18s ease-out}
.cta-quiet > span{padding-bottom:4px;border-bottom:1px solid currentColor}
.cta-quiet:hover{gap:13px}
.arr{flex:none}

/* entrances — transform/opacity only, ease-out */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes settle{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateX(34px) scale(1.02)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
.r{animation:rise .66s var(--ease) both}
.r1{animation-delay:.30s}.r2{animation-delay:.40s}.r3{animation-delay:.50s}
.r4{animation-delay:.58s}.r5{animation-delay:.66s}.r6{animation-delay:.76s}

/* shared photo layer */
.shot{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
/* dark variants overlay the nav on the image instead of stacking above it */
.v1 .frame > .nav,.v2 .frame > .nav,.v4 .frame > .nav{position:absolute;top:0;left:0;right:0;z-index:6}
.scrim{position:absolute;inset:0;z-index:1;pointer-events:none}

/* glass readout card, used by 1 and 4 */
.readout{padding:18px 20px 17px;border:1px solid rgba(255,255,255,.28);border-radius:16px;background:rgba(15,21,36,.86);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.05) inset;color:#fff;min-width:212px}
.readout .lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:600}
.readout .val{margin-top:8px;font-size:32px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1}
.readout .val span{font-size:14px;font-weight:400;color:rgba(255,255,255,.68);margin-left:5px;letter-spacing:0}
.readout .meta{margin-top:9px;font-size:12px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.readout svg{display:block;margin-top:12px;width:100%;height:34px;overflow:visible}
.readout .spark{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.5s var(--ease) 1.05s both}
.readout .ph{margin-top:11px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.45)}

/* seam */
.seam{padding:46px clamp(20px,4vw,56px) 92px;background:#fff;border-top:1px solid var(--line)}
.seam p{margin:0 auto;max-width:700px;text-align:center;color:var(--body);font-size:17px;line-height:1.6}
.seam b{color:var(--ink);font-weight:600}

/* ============================================================
   1 — VESSEL : the customer's world, full bleed and cinematic
   ============================================================ */
.v1{background:#07090F;color:#fff;position:relative;overflow:hidden}
.v1 .frame{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.v1 .shot{background-image:var(--img-hall);background-position:58% center;filter:saturate(.8) contrast(1.06);animation:settle 1.5s var(--ease) both}
.v1 .grade{background:linear-gradient(180deg,rgba(8,12,24,.72) 0%,rgba(8,12,24,.18) 34%,rgba(8,12,24,.15) 52%,rgba(6,9,18,.9) 100%)}
.v1 .well{background:radial-gradient(120% 110% at 2% 100%,rgba(4,7,14,.96) 0%,rgba(4,7,14,.84) 26%,rgba(4,7,14,.5) 48%,transparent 74%)}
.v1 .tint{background:linear-gradient(115deg,rgba(46,107,230,.2) 0%,transparent 46%);mix-blend-mode:screen}
.v1 .copy{position:relative;z-index:2;padding:clamp(28px,5vw,72px);max-width:860px}
.v1 .eyebrow{color:rgba(255,255,255,.88)}
.v1 h1{margin:20px 0 0;font-size:clamp(38px,5.6vw,74px);line-height:1;letter-spacing:-.03em;font-weight:600;max-width:min(15ch,100%);text-shadow:0 2px 30px rgba(0,0,0,.5)}
.v1 h1 em{font-style:normal;color:rgba(255,255,255,.74);font-weight:400}
.v1 p.sub{margin:22px 0 0;max-width:min(52ch,100%);color:rgba(255,255,255,.86);font-size:clamp(16.5px,1.35vw,18.5px);line-height:1.6}
.v1 .focus{margin:24px 0 0}
.v1 .cta-row{margin-top:32px}
.v1 .cta-quiet{color:#fff}
.v1 .cta-quiet > span{border-color:rgba(255,255,255,.5)}
.v1 .readout{position:absolute;z-index:3;bottom:clamp(30px,5vw,72px);right:clamp(24px,4vw,60px);animation:rise .7s var(--ease) .78s both}
@media(max-width:1024px){.v1 .readout{display:none}}

/* ============================================================
   2 — OBJECT : the instrument itself, as product photography
   ============================================================ */
.v2{background:#0A0C12;color:#fff;position:relative;overflow:hidden}
.v2 .frame{flex:1;position:relative;display:flex;align-items:center;padding-top:92px;overflow:hidden}
.v2 .shot{left:34%;background-image:var(--img-device);background-position:52% 52%;filter:saturate(.72) contrast(1.1) brightness(1.04);
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 26%,#000 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 26%,#000 100%);
  animation:slideIn 1.2s var(--ease) .1s both}
.v2 .grade{background:linear-gradient(90deg,#0A0C12 0%,rgba(10,12,18,.88) 32%,rgba(10,12,18,.1) 62%,rgba(10,12,18,.5) 100%)}
.v2 .glowline{position:absolute;z-index:2;left:0;bottom:0;height:1px;width:100%;background:linear-gradient(90deg,transparent,rgba(106,166,255,.5),transparent);animation:fade 1s ease-out 1.2s both}
.v2 .copy{position:relative;z-index:3;padding:clamp(24px,4vw,64px) clamp(20px,4vw,56px) clamp(48px,6vw,88px);max-width:min(660px,58%)}
.v2 .eyebrow{color:var(--blue-lt)}
.v2 h1{margin:20px 0 0;font-size:clamp(34px,4.6vw,62px);line-height:1.02;letter-spacing:-.03em;font-weight:600}
.v2 h1 em{font-style:normal;color:rgba(255,255,255,.66);font-weight:400}
.v2 p.sub{margin:22px 0 0;max-width:48ch;color:rgba(255,255,255,.8);font-size:17px;line-height:1.6}
.v2 .focus{margin:24px 0 0}
.v2 .cta-row{margin-top:30px}
.v2 .cta-quiet{color:#fff}
.v2 .cta-quiet > span{border-color:rgba(255,255,255,.5)}
.v2 .caption{position:absolute;z-index:3;right:clamp(20px,4vw,56px);bottom:clamp(22px,3vw,40px);max-width:280px;text-align:right;font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.7);animation:fade .7s ease-out 1.35s both}
.v2 .caption b{display:block;color:rgba(255,255,255,.92);font-weight:600;font-size:13px;margin-bottom:3px}
@media(max-width:900px){
  .v2 .frame{flex-direction:column;justify-content:flex-end}
  .v2 .shot{left:0;top:0;bottom:44%;-webkit-mask-image:linear-gradient(180deg,#000 52%,transparent 100%);mask-image:linear-gradient(180deg,#000 52%,transparent 100%)}
  .v2 .grade{background:linear-gradient(180deg,rgba(10,12,18,.3) 0%,rgba(10,12,18,.6) 42%,#0A0C12 62%)}
  .v2 .copy{max-width:none}
  .v2 .caption{display:none}
}

/* ============================================================
   3 — DUO : editorial split, type on paper against a live process
   ============================================================ */
.v3{background:#fff}
.v3 .frame{flex:1;display:grid;grid-template-columns:1.02fr .98fr;grid-template-rows:1fr;min-height:calc(100vh - 96px);position:relative}
.v3 .left{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:clamp(24px,3vw,44px) clamp(24px,4vw,64px) clamp(40px,5vw,72px)}
.v3 .eyebrow{color:var(--blue)}
.v3 h1{margin:18px 0 0;font-size:clamp(32px,3.9vw,52px);line-height:1.02;letter-spacing:-.03em;font-weight:600;color:var(--navy);max-width:min(14ch,100%)}
.v3 h1 em{font-style:normal;color:var(--body);font-weight:400}
.v3 p.sub{margin:22px 0 0;max-width:min(46ch,100%);color:var(--body);font-size:17px;line-height:1.62}
.v3 .cta-row{margin-top:30px}
.v3 .cta-quiet{color:var(--navy)}
.v3 .right{position:relative;overflow:hidden}
.v3 .shot{background-image:var(--img-skid);background-position:46% center;filter:saturate(.88) contrast(1.04);animation:settle 1.5s var(--ease) both}
.v3 .grade{background:linear-gradient(200deg,rgba(14,21,38,.34) 0%,transparent 44%,rgba(14,21,38,.42) 100%)}
.v3 .straddle{position:relative;z-index:4;margin:36px -96px 0 auto;display:inline-flex;align-items:center;gap:14px;padding:15px 22px 15px 18px;border-radius:16px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);border:1px solid rgba(20,28,48,.09);box-shadow:0 24px 60px rgba(14,21,38,.2),0 2px 6px rgba(14,21,38,.06);animation:rise .7s var(--ease) .64s both}
.v3 .straddle .k{display:block;font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--blue)}
.v3 .straddle .t{display:block;margin-top:5px;font-size:15px;font-weight:600;color:var(--navy);line-height:1.35}
.v3 .straddle .ic{width:42px;height:42px;border-radius:12px;background:var(--blue-pale);display:flex;align-items:center;justify-content:center;flex:none}
.v3 .straddle .ic svg{width:22px;height:22px}
@media(max-width:900px){
  .v3 .frame{grid-template-columns:1fr;grid-template-rows:auto 46vh}
  .v3 .left{padding-bottom:clamp(32px,6vw,52px)}
  .v3 .straddle{margin:26px 0 0 0;align-self:flex-start;box-shadow:0 12px 30px rgba(14,21,38,.12)}
}

/* ============================================================
   4 — LAYERED : glass panel over the process, device inset on top
   ============================================================ */
.v4{background:#080B12;color:#fff;position:relative;overflow:hidden}
.v4 .frame{flex:1;position:relative;display:flex;align-items:center;padding:104px clamp(20px,4vw,56px) clamp(44px,5vw,80px);overflow:hidden}
.v4 .shot{background-image:var(--img-hall);background-position:62% center;filter:saturate(.66) contrast(1.04) brightness(.82);animation:settle 1.6s var(--ease) both}
.v4 .grade{background:linear-gradient(120deg,rgba(6,9,16,.9) 0%,rgba(6,9,16,.62) 42%,rgba(6,9,16,.34) 70%,rgba(6,9,16,.76) 100%)}
.v4 .inner{position:relative;z-index:3;display:grid;grid-template-columns:1.06fr .94fr;align-items:center;gap:clamp(20px,3vw,44px);max-width:1500px;margin:0 auto;width:100%}
.v4 .panel{padding:clamp(28px,3.4vw,52px);border-radius:26px;border:1px solid rgba(255,255,255,.16);background:rgba(14,20,34,.52);-webkit-backdrop-filter:blur(26px) saturate(1.25);backdrop-filter:blur(26px) saturate(1.25);box-shadow:0 30px 80px rgba(0,0,0,.42);animation:rise .74s var(--ease) .24s both}
.v4 .eyebrow{color:var(--blue-lt)}
.v4 h1{margin:20px 0 0;font-size:clamp(32px,4.1vw,56px);line-height:1.03;letter-spacing:-.03em;font-weight:600}
.v4 h1 em{font-style:normal;color:rgba(255,255,255,.66);font-weight:400}
.v4 p.sub{margin:20px 0 0;max-width:46ch;color:rgba(255,255,255,.82);font-size:16.5px;line-height:1.6}
.v4 .focus{margin:22px 0 0}
.v4 .cta-row{margin-top:28px}
.v4 .cta-quiet{color:#fff}
.v4 .cta-quiet > span{border-color:rgba(255,255,255,.5)}
.v4 .stack{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:16px}
.v4 .tile{position:relative;width:min(430px,100%);aspect-ratio:3/2;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 70px rgba(0,0,0,.5);animation:rise .74s var(--ease) .42s both}
.v4 .tile .ph{position:absolute;inset:0;background-image:var(--img-device);background-size:cover;background-position:52% 54%;filter:saturate(.74) contrast(1.08)}
.v4 .tile .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:34px 18px 15px;background:linear-gradient(180deg,transparent,rgba(6,9,16,.88));font-size:12.5px;color:rgba(255,255,255,.9);font-weight:500}
.v4 .readout{width:min(430px,100%);animation:rise .7s var(--ease) .6s both}
@media(max-width:1000px){
  .v4 .inner{grid-template-columns:1fr}
  .v4 .stack{align-items:stretch;margin-top:20px}
  .v4 .tile{width:100%}
  .v4 .readout{display:none}
}

/* ---------- reduced motion ---------- */
@media(prefers-reduced-motion:reduce){
  .r,.v1 .shot,.v2 .shot,.v3 .shot,.v4 .shot,.v1 .readout,.v2 .caption,.v2 .glowline,
  .v3 .straddle,.v4 .panel,.v4 .tile,.v4 .readout,.readout .spark{
    animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important
  }
}

/* ============================================================
   PICKER — harness chrome. Verbatim from the skill spec.
   ============================================================ */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,.85)}
.proto-picker-item:active{transform:scale(.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}
.proto-picker-replay{padding:0 10px;font-size:14px}
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Vessel</button>
  <button class="proto-picker-item">Object</button>
  <button class="proto-picker-item">Duo</button>
  <button class="proto-picker-item">Layered</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">&#8635;</button>
</nav>

<script>
/* Audit copy deck, ch. 5 — verbatim. Nothing here asserts a claim the
   audit put behind a publication condition (no "<5 min", no "zero
   calibration") until the client confirms it per assay (B1/B2). */
const COPY = {
  eyebrow: "At-line analytics for biological processes",
  h1a: "Know what is happening in your process",
  h1b: "— while you can still act.",
  sub: "Q‑Tector combines ready-to-use assay pods, a compact reader and guided digital workflows to generate comparable glucose and sucrose results close to the fermenter or bioreactor. Use the data to compare runs, refine feed strategies and carry process knowledge from R&D to production.",
  subShort: "Ready-to-use assay pods, a compact reader and guided digital workflows — comparable glucose and sucrose results generated next to the fermenter, not days later in someone else's queue.",
  focus: "Current analytical focus: glucose and sucrose in culture media",
  cta1: "See how Q‑Tector works",
  cta2: "Discuss your process"
};
const HREF1 = "/technology";
const HREF2 = "/contact?intent=pilot&source_page=home&source_cta=hero&locale=en";
const ARROW = '<svg class="arr" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>';

function nav(tone){
  return '<div class="nav ' + tone + '">' +
    '<a href="#"><img src="/assets/SGPT_logo.png" alt="SG Papertronics"/></a>' +
    '<div class="nav-links">' +
      '<a href="#">Technology</a><a href="#">Applications</a>' +
      '<a href="#">Investors</a><a href="#">News</a><a href="#">Contact</a>' +
      '<a href="#" class="nav-cta">Discuss your process</a>' +
    '</div>' +
    '<button class="nav-burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>' +
    '</div>';
}
function seam(){
  return '<div class="seam"><p><b>Measure during the run, not after the opportunity to act.</b> Biological processes can change faster than laboratory feedback arrives.</p></div>';
}
function ctas(cls){
  return '<div class="cta-row r ' + cls + '">' +
    '<a class="cta-solid" href="' + HREF2 + '">' + COPY.cta2 + ARROW + '</a>' +
    '<a class="cta-quiet" href="' + HREF1 + '"><span>' + COPY.cta1 + '</span>' + ARROW + '</a>' +
  '</div>';
}
/* ILLUSTRATIVE placeholders pending the analyte x matrix x status
   matrix (open question A) — the card says so on its face. */
function readout(){
  return '<div class="readout">' +
    '<div class="lbl">Glucose &middot; run B&#8209;117</div>' +
    '<div class="val">4.2<span>g/L</span></div>' +
    '<div class="meta">t + 06:20 &middot; measured at the vessel</div>' +
    '<svg viewBox="0 0 200 34" fill="none" aria-hidden="true">' +
      '<path class="spark" d="M2 6 C 34 8, 52 13, 74 17 S 118 25, 150 28 L 198 31" stroke="#6AA6FF" stroke-width="2.2" stroke-linecap="round"/>' +
      '<circle cx="198" cy="31" r="3.4" fill="#6AA6FF"/>' +
    '</svg>' +
    '<div class="ph">Illustrative &mdash; pending assay matrix</div>' +
  '</div>';
}

/* ---------- 1 — VESSEL ----------
   Full bleed on the customer's world, not ours. The fold says "your
   process" and shows one; the readout card is the only thing in the
   frame that belongs to us. */
function vessel(){
  return '<div class="v v1">' + `
  <div class="frame">` + nav("on-dark") + `
    <div class="shot"></div>
    <div class="scrim grade"></div>
    <div class="scrim tint"></div>
    <div class="scrim well"></div>
    ${readout()}
    <div class="copy">
      <div class="eyebrow r r1"><span class="dot"></span>${COPY.eyebrow}</div>
      <h1 class="r r2">${COPY.h1a} <em>${COPY.h1b}</em></h1>
      <p class="sub r r3">${COPY.subShort}</p>
      <p class="focus focus-glass r r4"><span class="dot" aria-hidden="true"></span>${COPY.focus}</p>
      ${ctas('r5')}
    </div>
  </div>` + seam() + '</div>';
}

/* ---------- 2 — OBJECT ----------
   The instrument as product photography. The retouched shot carries no
   Beer-o-Meter mark, so the device can finally lead; it is masked into
   the background rather than boxed. */
function object(){
  return '<div class="v v2">' + `
  <div class="frame">` + nav("on-dark") + `
    <div class="shot"></div>
    <div class="scrim grade"></div>
    <div class="glowline"></div>
    <div class="copy">
      <div class="eyebrow r r1"><span class="dot"></span>${COPY.eyebrow}</div>
      <h1 class="r r2">${COPY.h1a} <em>${COPY.h1b}</em></h1>
      <p class="sub r r3">${COPY.sub}</p>
      <p class="focus focus-glass r r4"><span class="dot" aria-hidden="true"></span>${COPY.focus}</p>
      ${ctas('r5')}
    </div>
    <p class="caption"><b>Q&#8209;Tector reader</b>At the vessel, where the sample is taken &mdash; not in a queue somewhere else.</p>
  </div>` + seam() + '</div>';
}

/* ---------- 3 — DUO ----------
   Editorial split. Type sits on paper where it reads best, the process
   runs in the other half, and one card straddles the seam so the two
   halves read as a single composition rather than two boxes. */
function duo(){
  return '<div class="v v3">' + nav("on-light") + `
  <div class="frame">
    <div class="left">
      <div class="eyebrow r r1"><span class="dot"></span>${COPY.eyebrow}</div>
      <h1 class="r r2">${COPY.h1a} <em>${COPY.h1b}</em></h1>
      <p class="sub r r3">${COPY.subShort}</p>
      ${ctas('r4')}
      <div class="straddle">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#2E6BE6" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 15c3.5 0 4.5-8 8-8s4.5 5 6 3"/><circle cx="19" cy="10" r="1.6" fill="#2E6BE6" stroke="none"/></svg></span>
        <span><span class="k">Current analytical focus</span><span class="t">Glucose and sucrose in culture media</span></span>
      </div>
    </div>
    <div class="right">
      <div class="shot"></div>
      <div class="scrim grade"></div>
    </div>
  </div>` + seam() + '</div>';
}

/* ---------- 4 — LAYERED ----------
   The site's glass language at hero scale: a readable panel floating
   over the process, with the instrument as an inset tile, so the fold
   shows both the world and the thing. */
function layered(){
  return '<div class="v v4">' + `
  <div class="frame">` + nav("on-dark") + `
    <div class="shot"></div>
    <div class="scrim grade"></div>
    <div class="inner">
      <div class="panel">
        <div class="eyebrow r r1"><span class="dot"></span>${COPY.eyebrow}</div>
        <h1 class="r r2">${COPY.h1a} <em>${COPY.h1b}</em></h1>
        <p class="sub r r3">${COPY.sub}</p>
        <p class="focus focus-glass r r4"><span class="dot" aria-hidden="true"></span>${COPY.focus}</p>
        ${ctas('r5')}
      </div>
      <div class="stack">
        <div class="tile"><div class="ph"></div><div class="cap">Q&#8209;Tector reader, at the vessel</div></div>
        ${readout()}
      </div>
    </div>
  </div>` + seam() + '</div>';
}

/* ============ PICKER WIRING — behaviour contract from the spec ============ */
const variants = [vessel, object, duo, layered];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [].slice.call(picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)'));
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight(){
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = 'translateX(' + el.offsetLeft + 'px)';
}
function mount(i){
  stage.innerHTML = '';
  requestAnimationFrame(function(){ stage.innerHTML = variants[i](); });
}
function setActive(i){
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach(function(el,j){
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current','true'); else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach(function(el,i){ el.addEventListener('click', function(){ setActive(i); }); });
if (replay) replay.addEventListener('click', function(){ mount(current); });
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', function(e){
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(function(){ requestAnimationFrame(function(){ picker.setAttribute('data-ready',''); }); });
</script>
</body>
</html>
