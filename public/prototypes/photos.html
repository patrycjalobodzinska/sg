<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SG Papertronics — hero photo candidates</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   PROTOTYPE SURFACE — photo comparison. Not production.
   The LAYOUT is fixed (the Cinematic hero) so the only variable
   is the photograph. Every candidate is cropped to 16:9, cooled
   to one grade, and none of them is a brewery.
   ============================================================ */
:root{--navy:#080C18;--blue:#2E6BE6;--blue-light:#6AA6FF;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;background:var(--navy)}
img{display:block;max-width:100%}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes zoom{from{transform:scale(1.05)}to{transform:scale(1)}}
.r{animation:rise 460ms var(--ease) both}
.d1{animation-delay:70ms}.d2{animation-delay:140ms}.d3{animation-delay:210ms}
@media (prefers-reduced-motion:reduce){.r,.d1,.d2,.d3{animation:fade 1ms linear both !important}.kb{animation:none !important}}

.hero{position:relative;min-height:100vh;overflow:hidden;background:var(--navy)}
.kb{position:absolute;inset:0;background-size:cover;background-position:center;animation:zoom 1300ms var(--ease) both}
.grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,7,14,.74) 0%,rgba(4,7,14,.22) 34%,rgba(4,7,14,.62) 72%,rgba(4,7,14,.95) 100%)}
.nav{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:28px clamp(20px,4vw,56px)}
.nav img{height:32px;width:auto;filter:brightness(0) invert(1)}
.nav-links{display:flex;align-items:center;gap:clamp(14px,1.8vw,28px);font-size:15.5px;font-weight:600}
.nav-links a{color:rgba(255,255,255,.94);text-decoration:none}
.nav-cta{background:var(--blue);padding:10px 18px;border-radius:999px;font-weight:500;font-size:14.5px}
.burger{display:none;flex-direction:column;gap:5px;background:0;border:0;padding:8px;color:#fff;cursor:pointer}
.burger span{display:block;width:24px;height:2px;border-radius:2px;background:currentColor}
@media (max-width:940px){.nav-links{display:none}.burger{display:flex}}

.inner{position:relative;z-index:3;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(20px,5vw,72px) clamp(48px,7vh,88px);max-width:1500px;margin:0 auto}
h1{margin:0;color:#fff;font-weight:700;letter-spacing:-.03em;font-size:clamp(36px,5.2vw,74px);line-height:1;max-width:21ch}
.sub{margin:clamp(18px,2.2vw,26px) 0 0;color:rgba(255,255,255,.86);font-size:clamp(17px,1.7vw,22px);line-height:1.45;max-width:44ch}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:clamp(24px,3vw,34px)}
.btn{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-weight:500;font-size:16px;padding:15px 26px;border-radius:999px;background:var(--blue);color:#fff;transition:transform 180ms ease-out,box-shadow 180ms ease-out}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(46,107,230,.4)}
.btn-ghost{background:transparent;border:1px solid #fff;color:#fff;padding:14px 25px}
.strip{display:flex;flex-wrap:wrap;gap:clamp(18px,3vw,44px);margin-top:clamp(28px,4vh,44px);padding-top:22px;border-top:1px solid rgba(255,255,255,.22)}
.strip b{display:block;color:#fff;font-size:15.5px;font-weight:600;margin-bottom:3px}
.strip span{color:rgba(255,255,255,.6);font-size:13.5px;font-weight:500}

/* provenance, so nobody ships a photo without checking its licence */
.credit{
  position:absolute;top:96px;left:clamp(20px,5vw,72px);z-index:5;
  display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:8px;
  background:rgba(0,0,0,.55);color:rgba(255,255,255,.86);font-size:11.5px;font-weight:500;letter-spacing:.01em;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.credit b{color:#fff;font-weight:600}
.credit.warn{box-shadow:inset 0 0 0 1px rgba(255,180,80,.55)}

/* ============================================================
   PICKER — harness chrome. Verbatim from the skill spec.
   ============================================================ */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
</style>
</head>
<body>

<div id="stage"></div>

<nav class="proto-picker" aria-label="Photo candidates">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Reactor skid</button>
  <button class="proto-picker-item">Glass reactor</button>
  <button class="proto-picker-item">Reactor + trend</button>
  <button class="proto-picker-item">Bench</button>
  <button class="proto-picker-item">Current</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const PHOTOS = [
  { file: '/prototypes/photos/reactor-skid.jpg',
    credit: 'Wikimedia Commons · <b>CC BY-SA 4.0</b> · attribution + share-alike',
    warn: true },
  { file: '/prototypes/photos/reactor-glass.jpg',
    credit: 'Wikimedia Commons · <b>CC BY-SA 4.0</b> · attribution + share-alike',
    warn: true },
  { file: '/prototypes/photos/reactor-trend.jpg',
    credit: 'Wikimedia Commons · <b>CC BY-SA 4.0</b> · attribution + share-alike',
    warn: true },
  { file: '/prototypes/photos/bench-people.jpg',
    credit: 'Wikimedia Commons · <b>CC BY-SA 4.0</b> · attribution + share-alike',
    warn: true },
  { file: '/prototypes/qtector-hero-retouched.jpg',
    credit: 'Own photo, wordmark retouched out · <b>ours</b> · but it is a Beer‑o‑Meter',
    warn: false },
];

const render = (i) => {
  const p = PHOTOS[i];
  return `
<section class="hero">
  <div class="kb" style="background-image:url('${p.file}')"></div>
  <div class="grad"></div>
  <header class="nav">
    <a href="#"><img src="/assets/SGPT_logo.png" alt="SG Papertronics"/></a>
    <span class="nav-links">
      <a href="#">Technology</a><a href="#">Applications</a><a href="#">Investors</a><a href="#">News</a>
      <a class="nav-cta" href="#">Talk to us</a>
    </span>
    <button class="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  </header>
  <p class="credit${p.warn ? ' warn' : ''}">${p.credit}</p>
  <div class="inner">
    <h1 class="r">Know what is happening in your process<br/>— while you can still act.</h1>
    <p class="sub r d1">Q‑Tector puts guided at-line assays next to the fermenter, so glucose and sucrose results arrive while the run is still yours to change.</p>
    <div class="actions r d2">
      <a class="btn" href="#">See how Q‑Tector works</a>
      <a class="btn btn-ghost" href="#">Discuss your process</a>
    </div>
    <div class="strip r d3">
      <div><b>Glucose · Sucrose</b><span>What it measures today</span></div>
      <div><b>Culture media</b><span>Sample matrix</span></div>
      <div><b>At-line</b><span>Next to the run, not in a queue</span></div>
    </div>
  </div>
</section>`;
};

const variants = PHOTOS.map((_, i) => () => render(i));

const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
